name: Build S2B Hayagriva APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        run: |
          echo "=== PROJECT STRUCTURE ==="
          find . -maxdepth 5 -type f | sort
          echo "=== GRADLE PROJECTS ==="
          gradle --no-daemon projects
          echo "=== ASSEMBLE TASK ==="
          gradle --no-daemon :app:tasks --all | grep assembleDebug

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S2B-Hayagriva-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
