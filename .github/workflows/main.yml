name: Build S2B Hayagriva APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== GRADLE PROJECTS ==="
          gradle --no-daemon projects
          echo "=== GRADLE TASKS ==="
          gradle --no-daemon tasks --all | grep -E "assembleDebug|assembleRelease" || true

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          ls -lh build/outputs/apk/debug/
          test -f build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp build/outputs/apk/debug/app-debug.apk S2B-Hayagriva-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S2B-Hayagriva-debug-APK
          path: S2B-Hayagriva-debug.apk
          retention-days: 30
